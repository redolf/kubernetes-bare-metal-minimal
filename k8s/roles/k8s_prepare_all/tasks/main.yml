---
- name: "Создание директории .ssh"
  file:
    path: /home/{{ user_1 }}/.ssh
    state: directory
    mode: '0700'
    owner: "{{ user_1 }}"
    group: "{{ user_1 }}"

- name: "Добавление публичного ключа в authorized_keys"
  authorized_key:
    user: "{{ user_1 }}"
    state: present
    key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

- name: "Выключаем файл подкачки"
  mount:
    path: "{{ item }}"
    fstype: "swap"
    state: "absent"
  loop:
    - "swap"
    - "none"

# - name: "Выключаем файл подкачки"
#   command: "swapoff -a"
#   changed_when: false

# - name: "Обновление пакетов"
#   apt:
#     upgrade: yes
#     update_cache: yes

- name: "Загружаем модуль br_netfilter и overlay в ядро"
# Модуль br_netfilter расширяет возможности netfilter
  modprobe:
    name: "{{ item }}"
    state: "present"
  loop:
    - "br_netfilter"
    - "overlay"

- name: "Добавляем модуль br_netfilter для автозагрузки" 
  copy:
    content: |
      br_netfilter
      overlay
    dest: "/etc/modules-load.d/containerd.conf"
    mode: "0644"

- name: "Включаем обработку трафика через bridge в netfilter"
  sysctl:
    name: "{{ item.split('=')[0] }}"
    value: "{{ item.split('=')[1] }}"
    sysctl_file: "/etc/sysctl.d/99-kubernetes-cri.conf"
    state: present
  loop:
  - "net.ipv4.ip_forward=1"
  - "net.bridge.bridge-nf-call-iptables=1"
  - "net.bridge.bridge-nf-call-ip6tables=1"

