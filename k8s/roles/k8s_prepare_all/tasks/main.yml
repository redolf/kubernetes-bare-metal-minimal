---
- name: "Создание директории .ssh для пользователя {{ user_1 }}"
  file:
    path: /home/{{ user_1 }}/.ssh
    state: directory
    mode: '0700'
    owner: "{{ user_1 }}"
    group: "{{ user_1 }}"

- name: "Добавление публичного ключа для пользователя {{ user_1 }} в authorized_keys"
  authorized_key:
    user: "{{ user_1 }}"
    state: present
    key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"

- name: Добавим пользователя {{ user_1 }} в группу sudo Debian
  ansible.builtin.user:
    name: "{{ user_1 }}"
    groups: sudo
    append: yes  # Добавить в группу, не удаляя из других групп
  when: ansible_facts.os_family == "Debian"

- name: Настройка sudo без пароля для пользователя {{ user_1 }}
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^{{ user_1 }}'
    line: '{{ user_1 }} ALL=(ALL) NOPASSWD: ALL'
    validate: '/usr/sbin/visudo -cf %s'

- name: "Установка пакетов (Debian)"
  become: true
  apt:
    name:
      - bash-completion
      - curl
      - git
      - gnupg
      - iptables
      - mc
      - net-tools
      - nfs-common
      - python3
      - rsyslog
      - sudo
      - tar
      - wget
    state: present
    update_cache: yes
  when: ansible_facts.os_family == "Debian"

- name: "Установка пакетов (RedHat)"
  yum:
    name:
      - bash-completion
      - curl
      - git
      - gnupg
      - iptables
      - mc
      - net-tools
      - nfs-utils
      - python3
      - rsyslog
      - sudo
      - tar
      - wget
    state: latest
  when: ansible_facts.os_family == "RedHat"

- name: "Отключаем Firewall (RedHat)"
  service:
    name: firewalld
    state: stopped
    enabled: no
  when: ansible_facts.os_family == "RedHat"

- name: "Проверяем включён ли swap"
  shell: /sbin/swapon
  register: swap_present
  changed_when: false
  ignore_errors: true

- name: "Выключаем swap"
  shell: /sbin/swapoff -a
  when: swap_present.stdout != ""

- name: "Отключаем монтирование swap в /etc/fstab"
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\s*swap\s*.*)$'
    replace: '# \1'

- name: "Проверяем включен ли SeLinux (RedHat)"
  selinux:
    state: disabled
  register: selinux_ret
  when: ansible_facts.os_family == "RedHat"

- name: "Отключаем SeLinux (RedHat)"
  shell: setenforce 0
  when: 
    - ansible_facts.os_family == "RedHat"
    - selinux_ret.reboot_required

- name: "Загружаем модуль br_netfilter и overlay в ядро"
# Модуль br_netfilter расширяет возможности netfilter
  modprobe:
    name: "{{ item }}"
    state: "present"
  loop:
    - "br_netfilter"
    - "overlay"

- name: "Добавляем модуль br_netfilter для автозагрузки" 
  copy:
    content: |
      br_netfilter
      overlay
    dest: "/etc/modules-load.d/containerd.conf"
    mode: "0644"

- name: "Включаем обработку трафика через bridge в netfilter"
  sysctl:
    name: "{{ item.split('=')[0] }}"
    value: "{{ item.split('=')[1] }}"
    sysctl_file: "/etc/sysctl.d/99-kubernetes-cri.conf"
    state: present
  loop:
  - "net.ipv4.ip_forward=1"
  - "net.bridge.bridge-nf-call-iptables=1"
  - "net.bridge.bridge-nf-call-ip6tables=1"

- name: "Загрузка архива containerd-{{ containerd_version }} с Github"
  become: true
  shell: |
    curl -L -o /tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz \
    https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz

- name: "Распаковка архива containerd-{{ containerd_version }} с Github"
  unarchive:
    src: /tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz
    dest: /tmp
    remote_src: yes
    extra_opts: "--gzip"

- name: "Копируем файлы containerd-{{ containerd_version }} в /usr/local/bin"
  become: true
  copy:
    remote_src: yes
    src: /tmp/bin/
    dest: /usr/local/bin/
    force: yes

- name: "Создание директории /etc/containerd"
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: "Создание конфигурации по умолчанию для containerd"
  become: true
  shell: containerd config default | tee /etc/containerd/config.toml

- name: "Установка systemd сервиса для containerd"
  become: true
  shell: |
    curl -L -o /etc/systemd/system/containerd.service \
    https://raw.githubusercontent.com/containerd/containerd/main/containerd.service

- name: "Загружаем компонент runc v{{ runc_version }}"
  shell: |
    curl -L -o /tmp/runc.amd64 \
    https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.amd64

- name: "Установка компонента runc v{{ runc_version }}"
  become: true
  command: install -m 755 /tmp/runc.amd64 /usr/local/sbin/runc

- name: "Загружаем сетевые плагины CNI v{{ cni_plugin_version }}"
  shell: |
    curl -L -o /tmp/cni-plugins-linux-amd64-v{{ cni_plugin_version }}.tgz \
    https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugin_version }}/cni-plugins-linux-amd64-v{{ cni_plugin_version }}.tgz

- name: "Создание директории /opt/cni/bin для сетевых плагинов"
  file:
    path: /opt/cni/bin
    state: directory
    mode: '0755'

- name: "Распаковка сетевых плагинов CNI v{{ cni_plugin_version }}"
  unarchive:
    src: /tmp/cni-plugins-linux-amd64-v{{ cni_plugin_version }}.tgz
    dest: /opt/cni/bin
    remote_src: yes
    extra_opts: "--gzip"

- name: "Перезагрузка демонов systemd"
  become: true
  systemd:
    daemon_reload: true

- name: "Включение и запуск контейнера containerd"
  become: true
  systemd:
    name: containerd
    enabled: true
    state: started

- name: "Добавляем конфигурацию с указанием socket containerd для crictl"
  copy:
    content: |
      runtime-endpoint: unix:///var/run/containerd/containerd.sock
    dest: "/etc/crictl.yaml"
    mode: "0644"

- name: "Скачивание GPG-ключа"
  shell: |
    curl -L -o /tmp/Release.key \
    https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
  when: ansible_facts.os_family == "Debian"

- name: "Конвертация GPG-ключа в формат keyring"
  command: "gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/Release.key"
  when: ansible_facts.os_family == "Debian"

- name: "Установка прав доступа к ключу"
  file:
    path: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"
    mode: '0644'
  when: ansible_facts.os_family == "Debian"

- name: "Создание файла источника для Kubernetes"
  copy:
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /\n"
    dest: "/etc/apt/sources.list.d/kubernetes.list"
    mode: '0644'
  when: ansible_facts.os_family == "Debian"

- name: "Создание файла источника для Kubernetes (RedHat)"
  copy:
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/repodata/repomd.xml.key
    dest: "/etc/yum.repos.d/kubernetes.repo"
    mode: '0644'
  when: ansible_facts.os_family == "RedHat"

- name: "Установка бинарей: kubeadm, kubectl, kubelet"
  become: true
  package:
    name:
      - kubelet
      - kubectl
      - kubeadm
    state: present
    update_cache: yes

- name: "kubelet. Включение и запуск демона"
  systemd:
    name: kubelet
    enabled: true
    state: restarted

# MASTER TASKS
- name: "Установка вспомогательных пакетов на master hosts"
  become: true
  package:
    name:
      - keepalived
      - haproxy
    state: present
  when: "'k8s_master' in group_names"

- name: keepalived. Создание конфигурационного файла демона keepalived /etc/keepalived/keepalived.conf
  template:
    src: templates/keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
  when: "'k8s_master' in group_names"

- name: keepalived. Создание скрипта для проверки доступности хостов /etc/keepalived/check_apiserver.sh
  template:
    src: templates/check_apiserver.sh.j2
    dest: /etc/keepalived/check_apiserver.sh
    mode: '0755'
  when: "'k8s_master' in group_names"

- name: "keepalived. Включение и запуск демона"
  systemd:
    name: keepalived
    enabled: true
    state: restarted
  when: "'k8s_master' in group_names"

- name: haproxy. Создание конфигурационного файла демона haproxy /etc/haproxy/haproxy.cfg
  template:
    src: templates/haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
  when: "'k8s_master' in group_names"

- name: "haproxy. Включение и запуск демона"
  systemd:
    name: haproxy
    enabled: true
    state: restarted
  when: "'k8s_master' in group_names"

- name: Перезагрузка системы
  ansible.builtin.reboot:
    msg: "Перезагрузка инициирована Ansible"
    connect_timeout: 5  # Время ожидания подключения
    reboot_timeout: 600  # Время ожидания перезагрузки
