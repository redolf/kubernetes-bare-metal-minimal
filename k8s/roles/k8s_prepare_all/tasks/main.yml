- name: "Загрузка архива containerd-{{ containerd_version }} с Github"
  become: true
  get_url:
    url: https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz
    dest: /tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz

- name: "Распаковка архива containerd-{{ containerd_version }} с Github"
  unarchive:
    src: /tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz
    dest: /tmp
    remote_src: yes
    extra_opts: "--gzip"

- name: "Копируем файлы containerd-{{ containerd_version }} в /usr/local/bin"
  become: true
  copy:
    remote_src: yes
    src: /tmp/bin/
    dest: /usr/local/bin/
    force: yes

- name: "Создание директории /etc/containerd"
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: "Создание конфигурации по умолчанию для containerd"
  become: true
  shell: containerd config default | tee /etc/containerd/config.toml

- name: "Настройка cgroup драйвера"
  become: true
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'

- name: "Установка systemd сервиса для containerd"
  become: true
  get_url:
    url: https://raw.githubusercontent.com/containerd/containerd/main/containerd.service
    dest: /etc/systemd/system/containerd.service

- name: "Загружаем компонент runc v{{ runc_version }}"
  get_url:
    url: https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.amd64
    dest: /tmp/runc.amd64

- name: "Установка компонента runc v{{ runc_version }}"
  become: true
  command: install -m 755 /tmp/runc.amd64 /usr/local/sbin/runc

- name: "Загружаем сетевые плагины CNI v{{ cni_plugin_version }}"
  get_url:
    url: https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugin_version }}/cni-plugins-linux-amd64-v{{ cni_plugin_version }}.tgz
    dest: /tmp/cni-plugins-linux-amd64-v{{ cni_plugin_version }}.tgz

- name: "Создание директории /opt/cni/bin для сетевых плагинов"
  file:
    path: /opt/cni/bin
    state: directory
    mode: '0755'

- name: "Распаковка сетевых плагинов CNI v{{ cni_plugin_version }}"
  unarchive:
    src: /tmp/cni-plugins-linux-amd64-v{{ cni_plugin_version }}.tgz
    dest: /opt/cni/bin
    remote_src: yes
    extra_opts: "--gzip"

- name: "Перезагрузка демонов systemd"
  become: true
  systemd:
    daemon_reload: true

- name: "Включение и запуск контейнера containerd"
  become: true
  systemd:
    name: containerd
    enabled: true
    state: started

- name: "Установка вспомогательных пакетов"
  become: true
  apt:
    name:
      - curl
      - wget
      - gnupg
      - sudo
      - iptables
    state: present
    update_cache: yes

